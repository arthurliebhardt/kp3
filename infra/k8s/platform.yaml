apiVersion: v1
kind: ServiceAccount
metadata:
  name: yourpaas-worker
  namespace: yourpaas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yourpaas-worker
rules:
  - apiGroups: [""]
    resources: ["namespaces", "secrets", "services", "pods", "pods/log", "events"]
    verbs: ["create", "update", "patch", "get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "update", "patch", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "update", "patch", "get", "list", "watch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "update", "patch", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yourpaas-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yourpaas-worker
subjects:
  - kind: ServiceAccount
    name: yourpaas-worker
    namespace: yourpaas-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yourpaas-postgres
  namespace: yourpaas-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yourpaas-postgres
  namespace: yourpaas-system
spec:
  serviceName: yourpaas-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yourpaas-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yourpaas-postgres
        app.kubernetes.io/managed-by: yourpaas
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: yourpaas
            - name: POSTGRES_DB
              value: yourpaas
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yourpaas-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: yourpaas-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: yourpaas-postgres
  namespace: yourpaas-system
spec:
  selector:
    app.kubernetes.io/name: yourpaas-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yourpaas-registry
  namespace: yourpaas-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yourpaas-registry
  namespace: yourpaas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yourpaas-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yourpaas-registry
        app.kubernetes.io/managed-by: yourpaas
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: yourpaas-registry
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: yourpaas-system
spec:
  selector:
    app.kubernetes.io/name: yourpaas-registry
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: yourpaas-migrations
  namespace: yourpaas-system
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: __WORKER_IMAGE__
          command: ["sh", "-lc", "pnpm db:migrate && pnpm --filter @korepush/db db:bootstrap"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yourpaas-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://yourpaas:$(POSTGRES_PASSWORD)@yourpaas-postgres:5432/yourpaas
            - name: PLATFORM_BASE_DOMAIN
              value: __SERVER_IP__
            - name: INSTALLER_VERSION
              value: __VERSION__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yourpaas-web
  namespace: yourpaas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yourpaas-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yourpaas-web
        app.kubernetes.io/managed-by: yourpaas
    spec:
      containers:
        - name: web
          image: __WEB_IMAGE__
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yourpaas-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://yourpaas:$(POSTGRES_PASSWORD)@yourpaas-postgres:5432/yourpaas
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: yourpaas-secrets
                  key: BETTER_AUTH_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: yourpaas-secrets
                  key: ENCRYPTION_KEY
            - name: BETTER_AUTH_URL
              value: http://__SERVER_IP__
            - name: REGISTRY_URL
              value: registry.yourpaas-system.svc.cluster.local:5000
            - name: PLATFORM_BASE_DOMAIN
              value: __SERVER_IP__
            - name: SETUP_REQUIRED
              value: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yourpaas-worker
  namespace: yourpaas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yourpaas-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yourpaas-worker
        app.kubernetes.io/managed-by: yourpaas
    spec:
      serviceAccountName: yourpaas-worker
      containers:
        - name: worker
          image: __WORKER_IMAGE__
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yourpaas-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://yourpaas:$(POSTGRES_PASSWORD)@yourpaas-postgres:5432/yourpaas
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: yourpaas-secrets
                  key: ENCRYPTION_KEY
            - name: REGISTRY_URL
              value: registry.yourpaas-system.svc.cluster.local:5000
            - name: PLATFORM_NAMESPACE
              value: yourpaas-system
---
apiVersion: v1
kind: Service
metadata:
  name: yourpaas-web
  namespace: yourpaas-system
spec:
  selector:
    app.kubernetes.io/name: yourpaas-web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yourpaas-web
  namespace: yourpaas-system
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yourpaas-web
                port:
                  number: 80
